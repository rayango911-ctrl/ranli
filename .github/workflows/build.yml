name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show files
        run: find . -not -path './.git/*' -type f | head -50
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          F=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts غير موجود بالـ repo، ارفع ملفات المشروع"; exit 1; fi
          cd "$(dirname "$F")"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: prayer-apk
          path: '**/app-debug.apk'
