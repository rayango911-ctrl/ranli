name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/voicecall app/src/main/res/mipmap-xxxhdpi app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle.kts << 'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VoiceCall"
          include(":app")
          EOF_0
          cat > build.gradle.kts << 'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties << 'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_2
          cat > app/build.gradle.kts << 'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.voicecall"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.voicecall"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_3
          cat > app/src/main/AndroidManifest.xml << 'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />

              <!-- مطلوب من أندرويد 11 وطالع عشان SpeechRecognizer يشتغل -->
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:label="رنلي"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- ضغطة السماعة الطويلة (أمر صوتي) -->
                      <intent-filter>
                          <action android:name="android.intent.action.VOICE_COMMAND" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VOICE_ASSIST" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <meta-data
                          android:name="android.app.shortcuts"
                          android:resource="@xml/shortcuts" />
                  </activity>

                  <service
                      android:name=".RanliInteractionService"
                      android:exported="true"
                      android:permission="android.permission.BIND_VOICE_INTERACTION">
                      <meta-data
                          android:name="android.voice_interaction"
                          android:resource="@xml/voice_interaction_service" />
                      <intent-filter>
                          <action android:name="android.service.voice.VoiceInteractionService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".RanliSessionService"
                      android:exported="true"
                      android:permission="android.permission.BIND_VOICE_INTERACTION" />

                  <service
                      android:name=".RanliRecognitionService"
                      android:exported="true">
                      <intent-filter>
