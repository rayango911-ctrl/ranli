name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/voicecall app/src/main/res/mipmap-xxxhdpi
          cat > settings.gradle.kts << 'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VoiceCall"
          include(":app")
          EOF_0
          cat > build.gradle.kts << 'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties << 'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_2
          cat > app/build.gradle.kts << 'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.voicecall"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.voicecall"
                  minSdk = 27
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_3
          cat > app/src/main/AndroidManifest.xml << 'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />

              <!-- مطلوب من أندرويد 11 وطالع عشان SpeechRecognizer يشتغل -->
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:label="مساعدك ريان"
                  android:icon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- ضغطة السماعة الطويلة (أمر صوتي) -->
                      <intent-filter>
                          <action android:name="android.intent.action.VOICE_COMMAND" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VOICE_ASSIST" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          cat > app/src/main/java/com/example/voicecall/MainActivity.kt << 'EOF_5'
          package com.example.voicecall

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.ContactsContract
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Locale

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private var recognizer: SpeechRecognizer? = null

              private val perms = arrayOf(
                  Manifest.permission.RECORD_AUDIO,
                  Manifest.permission.READ_CONTACTS,
                  Manifest.permission.CALL_PHONE
              )

              // يقبل: رنلي على احمد / رن لي على احمد / ران لي ع احمد / رنلي احمد
              private val commandRegex =
                  Regex("""^ر+ا?ن+\S*\s*(?:لي|لى)?\s*(?:(?:على|علي|ع)\s+)?(.+)$""")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val blue = Color.parseColor("#0A1E78")
                  val purple = Color.parseColor("#5A1C8C")
                  val red = Color.parseColor("#C8102E")

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(48, 48, 48, 48)
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(blue, purple, red)
                      )
                  }
                  window.statusBarColor = blue
                  window.navigationBarColor = red

                  val title = TextView(this).apply {
                      text = "مساعدك ريان"
                      textSize = 34f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 96, 0, 0)
                  }
                  val slogan = TextView(this).apply {
                      text = "مع ريان حمل نقلتك بأمان"
                      textSize = 18f
                      setTextColor(Color.parseColor("#E6FFFFFF"))
                      gravity = Gravity.CENTER
                      setPadding(0, 16, 0, 0)
                  }
                  status = TextView(this).apply {
                      text = "اضغط الزر وقل: رنلي على [الاسم]"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 64)
                  }
                  val btn = Button(this).apply {
                      text = "🎤 احكي"
                      textSize = 22f
                      setTextColor(Color.parseColor("#1A1A2E"))
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 100f
                      }
                      setPadding(96, 32, 96, 32)
                      setOnClickListener { startListening() }
                  }
                  val content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      addView(status)
                      addView(btn)
                  }
                  layout.addView(title)
                  layout.addView(slogan)
                  layout.addView(
                      content,
                      LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  )
                  setContentView(layout)

                  if (isVoiceLaunch(intent)) handleLaunch(intent)
                  else if (!hasAllPerms()) requestPermissions(perms, 1)
              }

              private var pendingListen = false

              // لما تنفتح الشاشة من ضغطة السماعة (أمر صوتي) نبدأ الاستماع تلقائي
              private fun isVoiceLaunch(i: Intent?): Boolean {
                  val a = i?.action
                  return a == Intent.ACTION_VOICE_COMMAND ||
                      a == Intent.ACTION_ASSIST ||
                      a == "android.intent.action.VOICE_ASSIST" ||
                      i?.getBooleanExtra("autolisten", false) == true
              }

              private fun handleLaunch(i: Intent?) {
                  if (!isVoiceLaunch(i)) return
                  if (hasAllPerms()) {
                      startListening()
                  } else {
                      pendingListen = true
                      requestPermissions(perms, 1)
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleLaunch(intent)
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int, permissions: Array<out String>, grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (pendingListen && hasAllPerms()) {
                      pendingListen = false
                      startListening()
                  }
              }

              private fun hasAllPerms() = perms.all {
                  checkSelfPermission(it) == PackageManager.PERMISSION_GRANTED
              }

              private fun startListening() {
                  if (!hasAllPerms()) {
                      requestPermissions(perms, 1)
                      return
                  }
                  recognizer?.destroy()
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                      setRecognitionListener(object : RecognitionListener {
                          override fun onResults(results: Bundle?) {
                              val list = results
                                  ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                  ?: return
                              handleSpeech(list)
                          }
                          override fun onError(error: Int) {
                              status.text = "ما سمعتك، جرب كمان مرة"
                          }
                          override fun onReadyForSpeech(p: Bundle?) { status.text = "عم اسمعك..." }
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rms: Float) {}
                          override fun onBufferReceived(b: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onPartialResults(p: Bundle?) {}
                          override fun onEvent(t: Int, p: Bundle?) {}
                      })
                  }
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-JO") // غيّرها: ar-SA / ar-EG / ar-PS ...
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                  }
                  recognizer?.startListening(intent)
              }

              private fun handleSpeech(options: List<String>) {
                  // نجرب كل الاحتمالات اللي سمعها التعرف الصوتي
                  var name: String? = null
                  for (raw in options) {
                      val m = commandRegex.find(normalize(raw))
                      if (m != null) {
                          name = m.groupValues[1].trim()
                          break
                      }
                  }
                  if (name == null) {
                      status.text = "سمعت: \"${options.firstOrNull() ?: ""}\"\nما فهمت الأمر. قل: رنلي على [الاسم]"
                      return
                  }
                  status.text = "سمعت: \"${options.first()}\""
                  val matches = findContacts(name)
                  when {
                      matches.isEmpty() -> status.text = "ما لقيت \"$name\" بجهات الاتصال"
                      matches.size == 1 -> call(matches[0])
                      else -> chooseContact(matches)
                  }
              }

              // توحيد الحروف وإزالة التشكيل عشان المطابقة تكون أدق
              private fun normalize(s: String): String = s
                  .replace(Regex("[\\u064B-\\u065F\\u0640]"), "")
                  .replace(Regex("[أإآ]"), "ا")
                  .replace("ة", "ه")
                  .replace("ى", "ي")
                  .lowercase(Locale.ROOT)
                  .trim()

              private data class Contact(val name: String, val number: String)

              private fun findContacts(query: String): List<Contact> {
                  val q = normalize(query)
                  val result = LinkedHashMap<String, Contact>() // نشيل الأرقام المكررة
                  contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ),
                      null, null, null
                  )?.use { c ->
                      while (c.moveToNext()) {
                          val name = c.getString(0) ?: continue
                          val number = c.getString(1) ?: continue
                          if (normalize(name).contains(q)) {
                              result[number.filter { it.isDigit() || it == '+' }] = Contact(name, number)
                          }
                      }
                  }
                  // لو في اسم مطابق تماماً، نفضّله
                  val exact = result.values.filter { normalize(it.name) == q }
                  return if (exact.size == 1) exact else result.values.toList()
              }

              private fun chooseContact(list: List<Contact>) {
                  AlertDialog.Builder(this)
                      .setTitle("أي واحد؟")
                      .setItems(list.map { "${it.name}\n${it.number}" }.toTypedArray()) { _, i ->
                          call(list[i])
                      }
                      .show()
              }

              private fun call(contact: Contact) {
                  status.text = "عم اتصل على ${contact.name}..."
                  startActivity(Intent(Intent.ACTION_CALL, Uri.parse("tel:${Uri.encode(contact.number)}")))
              }

              override fun onDestroy() {
                  recognizer?.destroy()
                  super.onDestroy()
              }
          }
          EOF_5
